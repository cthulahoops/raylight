<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>raylight</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 14px system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; }
      #game { --size: min(100vw - 18rem, 100vh); flex: none; position: relative; width: var(--size); height: var(--size); }
      /* With the settings hidden, the game fills the screen. */
      body:has(#controls[hidden]) #game { --size: min(100vw, 100vh); }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
      /* Counters for what the player holds, over the bottom left of the game. */
      #hud { position: absolute; left: 0.75rem; bottom: 0.75rem; display: flex; gap: 0.5rem; pointer-events: none; }
      #hud output { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.75rem 0.25rem 0.5rem; border-radius: 1rem; background: #000b; color: #eee; font: 600 18px ui-monospace, monospace; }
      #hud output::before { content: ""; flex: none; }
      #flares-held::before { width: 0.35rem; height: 1rem; border-radius: 1px; background: linear-gradient(#ffb080 0 25%, #ff4d26 25%); transform: rotate(20deg); }
      #flares-held.cooling { color: #888; }
      #flares-held.empty { color: #f66; }
      #coins-collected::before { width: 0.9rem; height: 0.9rem; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1b0, #ffcc4d 45%, #b8860b); }
      /* Covers the game once the player's torch has gone out. */
      #game-over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; background: #000a; color: #eee; cursor: pointer; }
      #game-over[hidden] { display: none; }
      #game-over h1 { margin: 0; font: 700 48px system-ui, sans-serif; letter-spacing: 0.1em; color: #f66; }
      #game-over p { margin: 0; font-size: 18px; }
      /* A banner over the top of the game once the level is won, leaving the rest playable. */
      #level-cleared { position: absolute; top: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 0.75rem; background: #000a; color: #eee; cursor: pointer; white-space: nowrap; }
      #level-cleared[hidden] { display: none; }
      #level-cleared h1 { margin: 0; font: 700 36px system-ui, sans-serif; letter-spacing: 0.1em; color: #ffcc4d; }
      #level-cleared p { margin: 0; font-size: 16px; }
      #settings-toggle { position: fixed; top: 0.5rem; right: 0.5rem; z-index: 1; }
      #fps { position: fixed; top: 0.5rem; left: 0.5rem; z-index: 1; padding: 0.1rem 0.4rem; background: #000a; font: 12px ui-monospace, monospace; pointer-events: none; }
      /*
       * The controls fill the space beside the canvas, in as many columns as
       * fit. The columns sit inside the scrolling form, as columns of a fixed
       * height would overflow sideways rather than scroll.
       */
      #controls { flex: 1; align-self: stretch; overflow-y: auto; box-sizing: border-box; padding: 2.5rem 1rem 0.5rem; /* room for the Settings button */ }
      #sections { columns: 16rem; column-gap: 0.75rem; }
      #sections > * { break-inside: avoid; margin-bottom: 0.5rem; }
      #sections > button { width: 100%; }
      #controls details { border: 1px solid #333; border-radius: 4px; padding: 0.25rem 0.5rem; }
      #controls details[open] { padding-bottom: 0.5rem; }
      #controls summary { cursor: pointer; font-weight: 600; line-height: 1.75rem; position: relative; padding-right: 3.5rem; }
      #controls summary .copy { position: absolute; right: 0; top: 0.2rem; }
      #controls details[open] summary { margin-bottom: 0.5rem; }
      #controls details > label + label { margin-top: 0.5rem; }
      #controls label { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem; }
      #controls input { grid-column: 1 / -1; width: 100%; margin: 0; }
      #controls input[type="color"] { height: 1.5rem; }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="scene" width="1024" height="1024"></canvas>
      <div id="hud">
        <output id="flares-held" title="Flares held (Space to throw)"></output>
        <output id="coins-collected" title="Coins collected"></output>
      </div>
      <div id="game-over" hidden>
        <h1>GAME OVER</h1>
        <p>Press Space to play again</p>
      </div>
      <div id="level-cleared" hidden>
        <h1>LEVEL CLEARED</h1>
        <p>Press Space to play again</p>
      </div>
    </div>
    <button type="button" id="settings-toggle">Settings</button>
    <output id="fps"></output>
    <form id="controls" autocomplete="off" hidden>
      <div id="sections">
        <details open>
          <summary>Lighting <button type="button" class="copy">Copy</button></summary>
          <label>Light height <output for="light-height"></output>
            <input id="light-height" type="range" min="10" max="1000" step="10" value="200">
          </label>
          <label>Falloff rate <output for="falloff-rate"></output>
            <input id="falloff-rate" type="range" min="0" max="0.01" step="0.0001" value="0.005">
          </label>
        </details>
        <details open>
          <summary>Player <button type="button" class="copy">Copy</button></summary>
          <label>Torch colour
            <input id="torch-color" type="color" value="#ffd595">
          </label>
          <label>Torch brightness <output for="torch-brightness"></output>
            <input id="torch-brightness" type="range" min="0" max="10" step="0.1" value="4">
          </label>
          <label>Beam width <output for="beam-width"></output>
            <input id="beam-width" type="range" min="5" max="180" step="1" value="60">
          </label>
          <label>Glow brightness <output for="glow-brightness"></output>
            <input id="glow-brightness" type="range" min="0" max="3" step="0.05" value="1">
          </label>
          <label>Glow height <output for="glow-height"></output>
            <input id="glow-height" type="range" min="10" max="400" step="5" value="60">
          </label>
          <label>Glow falloff rate <output for="glow-falloff"></output>
            <input id="glow-falloff" type="range" min="0" max="0.03" step="0.0005" value="0.005">
          </label>
        </details>
        <details open>
          <summary>Flares <button type="button" class="copy">Copy</button></summary>
          <label>Crates <output for="crate-count"></output>
            <input id="crate-count" type="range" min="0" max="15" step="1" value="4">
          </label>
          <label>Cooldown (s) <output for="flare-cooldown"></output>
            <input id="flare-cooldown" type="range" min="0" max="10" step="0.5" value="2">
          </label>
          <label>Colour
            <input id="flare-color" type="color" value="#ff4d26">
          </label>
          <label>Brightness <output for="flare-brightness"></output>
            <input id="flare-brightness" type="range" min="0" max="5" step="0.1" value="5">
          </label>
          <label>Burn time (s) <output for="flare-burn-time"></output>
            <input id="flare-burn-time" type="range" min="1" max="40" step="0.5" value="5">
          </label>
          <label>Range <output for="flare-range"></output>
            <input id="flare-range" type="range" min="100" max="1000" step="10" value="300">
          </label>
          <label>Throw speed <output for="flare-speed"></output>
            <input id="flare-speed" type="range" min="50" max="600" step="10" value="380">
          </label>
          <label>Gravity <output for="flare-gravity"></output>
            <input id="flare-gravity" type="range" min="50" max="1000" step="10" value="300">
          </label>
          <label>Wall bounciness <output for="flare-bounce"></output>
            <input id="flare-bounce" type="range" min="0" max="1" step="0.05" value="0.7">
          </label>
          <label>Floor bounciness <output for="flare-floor-bounce"></output>
            <input id="flare-floor-bounce" type="range" min="0" max="0.9" step="0.05" value="0.65">
          </label>
          <label>Speed kept through floor bounce <output for="flare-floor-grip"></output>
            <input id="flare-floor-grip" type="range" min="0" max="1" step="0.05" value="0.4">
          </label>
        </details>
        <details open>
          <summary>Enemies <button type="button" class="copy">Copy</button></summary>
          <label>Count <output for="enemy-count"></output>
            <input id="enemy-count" type="range" min="0" max="30" step="1" value="10">
          </label>
          <label>Light that attracts them <output for="enemy-threshold"></output>
            <input id="enemy-threshold" type="range" min="0" max="1" step="0.01" value="0.25">
          </label>
          <label>Avoidance range <output for="enemy-avoid-range"></output>
            <input id="enemy-avoid-range" type="range" min="0" max="300" step="5" value="100">
          </label>
          <label>Avoidance strength <output for="enemy-avoid-strength"></output>
            <input id="enemy-avoid-strength" type="range" min="0" max="5" step="0.1" value="1.5">
          </label>
        </details>
        <details open>
          <summary>Gold <button type="button" class="copy">Copy</button></summary>
          <label>Count <output for="coin-count"></output>
            <input id="coin-count" type="range" min="0" max="30" step="1" value="20">
          </label>
          <label>Coin colour
            <input id="coin-color" type="color" value="#ffcc4d">
          </label>
          <label>Shine colour
            <input id="coin-emission-color" type="color" value="#ffc840">
          </label>
          <label>Shine brightness <output for="coin-emission"></output>
            <input id="coin-emission" type="range" min="0" max="3" step="0.05" value="1.2">
          </label>
          <label>Shimmer <output for="coin-shimmer"></output>
            <input id="coin-shimmer" type="range" min="0" max="0.5" step="0.01" value="0.15">
          </label>
        </details>
        <details>
          <summary>Pointer light (debugging) <button type="button" class="copy">Copy</button></summary>
          <label>Colour
            <input id="pointer-color" type="color" value="#6699ff">
          </label>
          <label>Intensity <output for="pointer-intensity"></output>
            <input id="pointer-intensity" type="range" min="0" max="10" step="0.1" value="0">
          </label>
        </details>
        <details open>
          <summary>Level editor</summary>
          <label>Click to draw walls instead of moving
            <input id="level-editor" type="checkbox">
          </label>
        </details>
        <button type="button" id="restart">Restart</button>
        <button type="button" class="copy">Copy all settings</button>
      </div>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
