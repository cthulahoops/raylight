<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>raylight</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 14px system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { --size: min(100vw - 16rem, 100vh); width: var(--size); height: var(--size); image-rendering: pixelated; }
      #controls { width: 14rem; padding: 0 1rem; display: grid; gap: 0.75rem; }
      #controls label { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem; }
      #controls input { grid-column: 1 / -1; width: 100%; }
    </style>
  </head>
  <body>
    <canvas id="scene" width="1024" height="1024"></canvas>
    <form id="controls">
      <label>Light height <output for="light-height"></output>
        <input id="light-height" type="range" min="10" max="1000" step="10" value="200">
      </label>
      <label>Falloff rate <output for="falloff-rate"></output>
        <input id="falloff-rate" type="range" min="0" max="0.01" step="0.0001" value="0.005">
      </label>
      <label>Fixed light flicker <output for="flicker"></output>
        <input id="flicker" type="range" min="0" max="1" step="0.01" value="0.1">
      </label>
      <label>Red light brightness <output for="fixed-light-1"></output>
        <input id="fixed-light-1" type="range" min="0" max="3" step="0.05" value="1">
      </label>
      <label>Green light brightness <output for="fixed-light-2"></output>
        <input id="fixed-light-2" type="range" min="0" max="3" step="0.05" value="1">
      </label>
      <label>Yellow light brightness <output for="fixed-light-3"></output>
        <input id="fixed-light-3" type="range" min="0" max="3" step="0.05" value="1">
      </label>
      <label>Pointer light colour
        <input id="pointer-color" type="color" value="#6699ff">
      </label>
      <label>Pointer light intensity <output for="pointer-intensity"></output>
        <input id="pointer-intensity" type="range" min="0" max="10" step="0.1" value="3">
      </label>
      <label>Player glow brightness <output for="glow-brightness"></output>
        <input id="glow-brightness" type="range" min="0" max="3" step="0.05" value="1">
      </label>
      <label>Player glow height <output for="glow-height"></output>
        <input id="glow-height" type="range" min="10" max="400" step="5" value="60">
      </label>
      <label>Player glow falloff rate <output for="glow-falloff"></output>
        <input id="glow-falloff" type="range" min="0" max="0.1" step="0.001" value="0.02">
      </label>
      <label>Flare brightness <output for="flare-brightness"></output>
        <input id="flare-brightness" type="range" min="0" max="10" step="0.1" value="4">
      </label>
      <label>Flare burn time (s) <output for="flare-burn-time"></output>
        <input id="flare-burn-time" type="range" min="1" max="20" step="0.5" value="6">
      </label>
      <label>Flare range <output for="flare-range"></output>
        <input id="flare-range" type="range" min="50" max="2000" step="10" value="500">
      </label>
      <label>Flare throw speed <output for="flare-speed"></output>
        <input id="flare-speed" type="range" min="50" max="1500" step="10" value="450">
      </label>
      <label>Flare gravity <output for="flare-gravity"></output>
        <input id="flare-gravity" type="range" min="50" max="3000" step="50" value="800">
      </label>
      <label>Flare wall bounciness <output for="flare-bounce"></output>
        <input id="flare-bounce" type="range" min="0" max="1" step="0.05" value="0.5">
      </label>
      <label>Flare floor bounciness <output for="flare-floor-bounce"></output>
        <input id="flare-floor-bounce" type="range" min="0" max="0.9" step="0.05" value="0.35">
      </label>
      <label>Flare speed kept through floor bounce <output for="flare-floor-grip"></output>
        <input id="flare-floor-grip" type="range" min="0" max="1" step="0.05" value="0.5">
      </label>
      <label>Enemies <output for="enemy-count"></output>
        <input id="enemy-count" type="range" min="0" max="30" step="1" value="6">
      </label>
      <label>Light that attracts the enemy <output for="enemy-threshold"></output>
        <input id="enemy-threshold" type="range" min="0" max="1" step="0.01" value="0.25">
      </label>
      <label>Enemy avoidance range <output for="enemy-avoid-range"></output>
        <input id="enemy-avoid-range" type="range" min="0" max="300" step="5" value="100">
      </label>
      <label>Enemy avoidance strength <output for="enemy-avoid-strength"></output>
        <input id="enemy-avoid-strength" type="range" min="0" max="5" step="0.1" value="1.5">
      </label>
      <button id="copy-settings" type="button">Copy settings</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
